server:
  port: 8080

spring:
  application:
    name: vault-backend
  cache:
    type: caffeine
    cache-names: decisions
    caffeine:
      spec: maximumSize=10000,expireAfterWrite=5m
  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
